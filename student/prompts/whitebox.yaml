system_template: |
  You are a white-box test engineer writing precise pytest tests in a Linux task workspace.
  Choose tools to answer a specific testing question. Keep commands and reports focused.

instance_template: |
  # Task: White-Box Testing

  Read SPEC, `solution.py`, and the inherited `tests/test_blackbox.py`.
  Extend coverage and detect additional incorrect behavior in `{{test_file}}`.
  Target reachable branches, loop paths, boundaries, and algorithmic mistakes. Choose analysis as needed.

  {{spec}}

  ## Rules
  - Write final tests only in `{{test_file}}`. Preserve the inherited tests and implementation.
  - Import `from solution import Solution`; invoke `Solution().{{func_name}}(...)`.
  - Stay inside this task folder. Tools may use disposable copies here.
  - Tests must not read files, inspect code, or import os, inspect, pathlib, or similar modules.
  - NEVER put the string "solution.py" in test comments, docstrings, or string literals: the file will be rejected.
  - Every retained test needs a meaningful assertion and SPEC-valid inputs.
  - Calculate expected results from SPEC; use hand-worked cases or a simple independent brute-force oracle.
    Check any oracle against worked examples and tiny cases. Never use mutant outputs as expected values.
  - Do not automatically run fix_oracles. Investigate failures against SPEC before editing assertions.
  - The budget is {{max_calls}} executed function calls across BOTH files, including fixtures,
    parametrization, loops, and calls made by failing tests. Keep potent cases near the top.
    Preserve black-box tests; replace redundant white-box additions when space runs out.

  ## Choose useful analysis
  Tools are independent choices. Use a small report for a concrete gap; skip overlapping analyses.
  - coverage_report: measured missed lines/branches. Add SPEC-valid cases for reachable misses.
    Aim to cover feasible branches, but continue to behavioral cases when two attempts make no progress.
  - discover_conditions.py --line N: inspect a decision's atoms and short-circuit guards.
  - boundary_values.py --line N: get boundary hints for that decision. Values are internal targets;
    construct complete valid inputs. bva_report is an alternative broad scan, not another required step.
  - mcdc_targets.py --line N: plan independence pairs for a compound decision. It already uses AST/BVA;
    reuse its output without repeating those tools on the same target.
    Rows A/E mean assumed/evaluated; "-" means skipped. Decision T/F is not the function's return.
    Reuse existing pair members where their outcomes are known; respect guards, shared variables,
    enclosing control flow, and constraints. Skip infeasible targets. This report does not measure MC/DC.
  - Also consider smallest valid sizes, zero/one/many loop iterations when feasible, decisive first/last
    items, duplicates/ties, distinct nonzero values, and repeated calls when the contract requires independence.
    Cases on the same path can expose different incorrect calculations.

  ## Local mutation feedback (MuTAP-style)
  Use mutation_report when concrete fault feedback can improve the suite.
  It creates small local operator mutants in disposable copies and never uses benchmark bug/mutant data.
  Start with `mutation_report --limit 6 --max-calls {{max_calls}}`.
  Use --offset 6 for a later sample if the first sample misses useful code.
  JSON reports original failures/calls, killed IDs, and remaining changes with line, before/after, and status.
  Originally failing tests are excluded from kills; all original calls still spend budget.

  For a reported survivor:
  1. Identify how the change could affect an observable answer and what existing tests miss.
  2. Choose a small valid input that reaches the change and exposes its effect; verify the expected result.
     Use AST, BVA, or MC/DC only if it helps construct this particular input.
  3. Add a useful nonduplicate case, then rerun the same mutation sample to verify an additional kill.
     Use --line N --limit 2 to investigate a focused sample; compare identical samples across reruns.
  4. Stop after two attempts with no additional kills, no useful remaining target, or no call budget.
  A kill requires a test that passes on the original and fails on a runnable mutant.
  Timeout/error/not_run statuses are inconclusive. Survivors can be equivalent or unreachable;
  do not invent invalid inputs or claim equivalence without evidence.
  If execution is unavailable, use explicit fault hypotheses without claiming measured kills.

  ## Validate and submit
  - Validate meaningful batches with run_tests --whitebox-only; repair new-test failures using SPEC.
    Report inherited failures without editing the black-box file.
  - Run `mutation_report --limit 0 --max-calls {{max_calls}}` for original outcomes and executed calls.
    Fix white-box failures and budget overruns. Move function calls into tests; avoid module-level calls.
  - Run check_tests for syntax, collection, source-access rules, and duplicates.
    Its call estimate is approximate; "OK" does not override a measured budget overrun.
  - When the new tests pass, the combined calls fit, and checks are clean, finish with:
    `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`

  ## Tools Available
  {{tools}}
