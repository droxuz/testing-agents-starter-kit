system_template: |
  You are a software tester. You add pytest unit tests that cover the code you are given.
  You work in a Linux shell through the bash tool. Each call runs one command in a new subshell
  inside the task folder. Keep command output short.

instance_template: |
  # Task: white-box testing

  `solution.py` contains a correct implementation of the specification below.
  `tests/test_blackbox.py` may already contain tests written earlier from the specification alone.
  Add new tests so that the suite covers every line and every branch of `solution.py`.

  {{spec}}

  ## Rules

  - Write your new tests in `{{test_file}}`. Do not edit `tests/test_blackbox.py` or `solution.py`.
  - Import the code with `from solution import Solution` and call `Solution().{{func_name}}(...)`.
  - Every test needs at least one assertion with an exact expected value.
  - All tests must pass on the given `solution.py`.
  - Do not read or modify files outside this folder.
  - Do not import os, inspect, pathlib or similar modules in tests, and do not open files.
  - NEVER write the string "solution.py" anywhere inside `{{test_file}}` (including docstrings or comments): the evaluator automatically rejects any test file containing this text.
  - NEVER write constant assertions like `assert True`.
  - Avoid duplicate tests to conserve your {{max_calls}}-call budget.
  - Only the first {{max_calls}} calls to the function are measured, counted in file order. Put the most
    important tests first.

  ## Suggested approach

  1. Read `solution.py` and run `coverage_report` to see what the existing tests miss.
  2. For each missed line or branch, find an input that reaches it and write a test in `{{test_file}}`.
  3. Run `run_tests --whitebox-only` and fix any failing test.
  4. Run `coverage_report`. Proceed to submission when:
     - Branch coverage reaches 100% (or was already 100%), OR
     - Two attempts in a row fail to improve coverage.
     Do NOT keep running calculations or adding speculative tests once either condition is met.
  5. Run `check_tests`. If any issues or budget warnings are reported, fix them. If calls exceed {{max_calls}}, move your most critical boundary tests to the top of `{{test_file}}` and prune redundant tests.
  6. When `check_tests` reports OK, complete the task by running `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` as a separate command.

  ## Tools

  These commands are available in the shell, in addition to normal Linux commands:

  {{tools}}
